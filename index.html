<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame</title>

    <!-- Self-hosted, variable-weight, ~110 KB for all four files. Declared here
         rather than in a CSS import so the browser discovers them in the first
         parse — and preloaded, because the grid measures text in canvas and a
         late font swap re-measures every column. Latin subsets only; the Noto
         fallbacks in the token stack carry Arabic and CJK. -->
    <link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Schibsted Grotesk';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/schibsted-grotesk-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Schibsted Grotesk';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/schibsted-grotesk-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <script>
      // Runs before first paint so the theme does not flash on reload.
      //
      // The one trap worth the comment: "auto" is the ABSENCE of data-theme,
      // not a value. brand-tokens.css selects the auto branch with
      // :root:not([data-theme]) inside a prefers-color-scheme query, so writing
      // data-theme="auto" matches no theme block, silently pins light, and
      // disables system following. Remove the attribute instead.
      ;(function () {
        try {
          var pref = localStorage.getItem('frame-theme') || 'system'
          var root = document.documentElement
          if (pref === 'light' || pref === 'grey' || pref === 'dark') {
            root.setAttribute('data-theme', pref)
          } else {
            root.removeAttribute('data-theme')
          }
        } catch (_) {
          /* private mode, storage disabled: fall through to system */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
